name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      # Production dependencies must have no high or critical advisories. Remaining dev-only/low findings are listed in docs/PRODUCT_AUDIT.md.
      - run: npm audit --omit=dev --audit-level=high
